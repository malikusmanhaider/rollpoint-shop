<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RollPoint — Thermal Rolls, Labels & POS Supplies</title>
  <meta name="description" content="RollPoint — thermal rolls, labels and POS supplies delivered across Pakistan. Flat Rs. 250 shipping, cash on delivery.">

  <meta name="theme-color" content="#E04F16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Fonts: Bricolage Grotesque · Instrument Sans · IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Main & Admin Stylesheets -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<!-- Top Route Progress Bar -->
<div id="top-progress-bar"></div>

<noscript><div style="padding:20px;font-family:sans-serif">RollPoint requires JavaScript to browse products and place orders.</div></noscript>

<!-- Announcement strip -->
<div class="topbar">
  <div class="topbar-in" id="topbar"></div>
</div>

<!-- Header (rendered from DB by js/app.js) -->
<header class="masthead" id="site-header"></header>

<!-- Mobile drawer -->
<div class="overlay" id="overlay" data-action="menu-close"></div>
<aside class="drawer" id="drawer" aria-label="Mobile menu">
  <div class="drawer-head">
    <div style="display:flex;align-items:center;gap:8px">
      <img src="/favicon.png" alt="RollPoint" style="width:30px;height:30px;border-radius:8px">
      <span class="brand-name">Roll<em>Point</em></span>
    </div>
    <button class="icon-btn" data-action="menu-close" aria-label="Close menu"><i data-lucide="x"></i></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<!-- Routed pages render here -->
<main id="app"></main>

<!-- Footer (rendered from DB by js/app.js) -->
<footer id="site-footer"></footer>

<!-- Mobile Sticky Buy Bar (for Product Detail Page) -->
<div id="pdp-sticky-bar-root"></div>

<!-- Mobile Bottom Navigation Dock -->
<nav class="mobile-bottom-bar" id="mobile-bottom-bar" aria-label="Mobile navigation"></nav>

<!-- Global Toast Notifications -->
<div id="toast-root" aria-live="polite"></div>

<!-- Scripts -->
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
